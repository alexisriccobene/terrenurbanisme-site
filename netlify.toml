[build]
  publish = "."
  # Mise en ligne uniquement sur demande : le message du commit doit contenir [en ligne].
  # Les modifications s'accumulent entre deux mises en ligne (une seule mise en ligne = un seul décompte de crédits).
  ignore = "if git log -1 --pretty=%B $COMMIT_REF | grep -qF '[en ligne]'; then git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)netlify.toml'; else exit 0; fi"
