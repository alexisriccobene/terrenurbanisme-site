    <h1>Accès restreint</h1>
      <div>
        <p>Vous rencontrez actuellement des difficultés pour accéder à notre site en raison de restrictions de sécurité.
        </p>
        <p>Si vous pensez que ce blocage est une erreur, nous vous invitons à contacter notre support. Merci de votre
          compréhension.</p>
        <p id="reference-id"></p>
      </div>
  </article>
  <script>
    // Vérification si l’API Fetch est disponible dans le navigateur
    if (typeof fetch === 'function') {
      fetch(window.location.href, { method: 'HEAD' })
        .then(response => {
          const referenceId = response.headers.get('X-REFERENCE-ID');
          if (referenceId) {
            document.getElementById('reference-id').innerText = `Numéro de référence : ${referenceId}`;
          } else {
            document.getElementById('reference-id').innerText = 'Référence non disponible';
          }
        })
        .catch(error => {
          console.error('Erreur lors de la récupération de l\'ID de référence:', error);
        });
    } else {
      console.warn('Fetch API non supportée par ce navigateur.');
    }
  </script>
