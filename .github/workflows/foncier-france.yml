name: Foncier France
# Charge la base « foncier entreprises » département par département (liste dans .github/foncier/france.json)
on:
  push:
    branches: [main]
    paths: ['.github/foncier/france.json']
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deps: ${{ steps.l.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          python3 - >> $GITHUB_OUTPUT <<'PY'
          import json
          d = json.load(open('.github/foncier/france.json'))['deps']
          if d == 'all':
              d = [f'{i:02d}' for i in range(1, 96) if i != 20] + ['2A', '2B', '971', '972', '973', '974', '976']
          print('deps=' + json.dumps(d))
          PY
      - run: pip install -q requests && mkdir -p /tmp/commun && python3 -u .github/foncier/prep.py
      - uses: actions/upload-artifact@v4
        with: { name: commun, path: /tmp/commun, retention-days: 3 }
  dep:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        dep: ${{ fromJson(needs.prep.outputs.deps) }}
    env:
      SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: nmoigruxnhsidrhqtzid
      DEP: ${{ matrix.dep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: commun, path: /tmp/commun }
      - run: pip install -q shapely pyproj requests ijson
      - run: python3 -u .github/foncier/charge_dep.py
