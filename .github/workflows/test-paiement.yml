name: Test page de paiement
on:
  push:
    branches: [main]
    paths: ['.github/sync/test-paiement.json']
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          r=$(curl -s -X POST "https://nmoigruxnhsidrhqtzid.supabase.co/functions/v1/create-checkout" -H "Origin: https://terrenurbanisme.com" -H "Content-Type: application/json" \
            -d '{"kind":"unit","insee":"2A247","section":"G","numero":"1766","commune":"Porto-Vecchio","src":{"ref":"test","page":"/","utm":""}}')
          echo "$r" | sed -E 's#(cs_[a-z]+_)[A-Za-z0-9]+#\1…#g' | head -c 300; echo
          curl -s -X POST "https://nmoigruxnhsidrhqtzid.supabase.co/functions/v1/origine-ventes" -H "Content-Type: application/json" -d '{}'
