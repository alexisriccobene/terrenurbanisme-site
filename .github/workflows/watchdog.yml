name: Surveillance des rapports
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Relancer les rapports bloqués
        env:
          KEY: ${{ secrets.TU_ADMIN_KEY }}
        run: |
          code=$(curl -s -o out.txt -w "%{http_code}" -X POST "https://nmoigruxnhsidrhqtzid.supabase.co/functions/v1/stripe-webhook?key=${KEY}&sweep=1")
          echo "HTTP $code : $(head -c 200 out.txt)"
