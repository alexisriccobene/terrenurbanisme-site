name: Recadrer les logos des abonnés
# Retire les marges vides autour des logos déjà enregistrés, pour qu'ils apparaissent en grand sur les rapports.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: nmoigruxnhsidrhqtzid
    steps:
      - run: pip install -q pillow
      - run: |
          python3 - <<'PY'
          import os, io, json, time, urllib.request
          from PIL import Image, ImageChops
          base = f"https://{os.environ['REF']}.supabase.co"
          H = {'apikey': os.environ['SR'], 'Authorization': 'Bearer ' + os.environ['SR']}
          def req(url, data=None, method='GET', extra=None):
              r = urllib.request.Request(url, data=data, method=method, headers={**H, **(extra or {})})
              with urllib.request.urlopen(r, timeout=60) as x: return x.read()
          rows = json.loads(req(base + '/rest/v1/marques?select=user_id,logo_path&logo_path=not.is.null'))
          for row in rows:
              p = row['logo_path']
              try:
                  im = Image.open(io.BytesIO(req(base + '/storage/v1/object/logos/' + p))).convert('RGBA')
                  w, h = im.size
                  a = im.split()[3]
                  bg = Image.new('RGB', im.size, (255, 255, 255))
                  diff = ImageChops.difference(im.convert('RGB'), bg).convert('L').point(lambda v: 255 if v > 12 else 0)
                  mask = ImageChops.multiply(diff, a.point(lambda v: 255 if v > 16 else 0))
                  box = mask.getbbox()
                  if not box or (box[2] - box[0]) * (box[3] - box[1]) > 0.9 * w * h:
                      print('inchangé', p); continue
                  m = int(max(box[2] - box[0], box[3] - box[1]) * 0.04)
                  box = (max(0, box[0] - m), max(0, box[1] - m), min(w, box[2] + m), min(h, box[3] + m))
                  out = im.crop(box)
                  if max(out.size) > 1200:
                      k = 1200 / max(out.size); out = out.resize((round(out.size[0] * k), round(out.size[1] * k)), Image.LANCZOS)
                  buf = io.BytesIO(); out.save(buf, 'PNG', optimize=True)
                  np = row['user_id'] + '/logo-' + str(int(time.time() * 1000)) + '.png'
                  req(base + '/storage/v1/object/logos/' + np, buf.getvalue(), 'POST', {'Content-Type': 'image/png', 'x-upsert': 'true'})
                  req(base + '/rest/v1/marques?user_id=eq.' + row['user_id'], json.dumps({'logo_path': np}).encode(), 'PATCH', {'Content-Type': 'application/json', 'Prefer': 'return=minimal'})
                  print('recadré', p, (w, h), '->', out.size)
              except Exception as e:
                  print('erreur', p, str(e)[:200])
          PY
