name: Diagnostic règlements
# Outil interne : télécharge des règlements publics (Géoportail de l'Urbanisme) et enregistre taille, pages et début du texte dans tu_debug.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses des PDF, séparées par des espaces"
        required: true
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: nmoigruxnhsidrhqtzid
      URLS: ${{ github.event.inputs.urls }}
    steps:
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Lire
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          out = []
          for u in os.environ['URLS'].split():
              r = {'url': u}
              try:
                  rq = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 TerrenUrbanisme'})
                  with urllib.request.urlopen(rq, timeout=300) as resp:
                      data = resp.read(); r['status'] = resp.status; r['type'] = resp.headers.get('Content-Type')
                  r['bytes'] = len(data)
                  if 'html' in (r['type'] or ''):
                      import re
                      h = data.decode('utf-8', 'replace')
                      r['liens'] = sorted(set(re.findall(r'href=["\']([^"\']+\.pdf)', h, re.I)))[:400]
                      out.append(r); continue
                  open('/tmp/d.pdf', 'wb').write(data)
                  info = subprocess.run(['pdfinfo', '/tmp/d.pdf'], capture_output=True, text=True).stdout
                  r['pages'] = next((l.split(':', 1)[1].strip() for l in info.splitlines() if l.startswith('Pages')), None)
                  t = subprocess.run(['pdftotext', '-l', '4', '-layout', '/tmp/d.pdf', '-'], capture_output=True, text=True).stdout
                  r['debut'] = t[:3000]
                  outl = subprocess.run(['pdftotext', '/tmp/d.pdf', '-'], capture_output=True, text=True).stdout
                  r['chars'] = len(outl)
              except Exception as e:
                  r['erreur'] = str(e)[:300]
              out.append(r)
          q = "insert into public.tu_debug (k, v) values ('diag_reglement', $tu$" + json.dumps(out, ensure_ascii=False).replace('$tu$', '') + "$tu$::jsonb)"
          rq = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query", data=json.dumps({'query': q}).encode(), method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json'})
          print(urllib.request.urlopen(rq, timeout=60).status)
          PY
