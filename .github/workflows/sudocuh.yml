name: Etat officiel des documents d'urbanisme
on:
  workflow_dispatch:
    inputs:
      src: { description: "adresse du fichier SuDocUH (xlsx)", required: true }
permissions:
  contents: read
jobs:
  charger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: nmoigruxnhsidrhqtzid
      SRC: ${{ github.event.inputs.src }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - run: pip install -q openpyxl
      - run: python3 .github/scripts/sudocuh.py
