name: IndexNow
on:
  push:
    branches: [main]
    paths: [sitemap.xml, .github/scripts/indexnow.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 120 && python3 .github/scripts/indexnow.py
