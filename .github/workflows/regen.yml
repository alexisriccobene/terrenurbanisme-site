name: Régénérer un rapport
on:
  workflow_dispatch:
    inputs:
      session:
        description: "Identifiant de la commande (stripe_session_id)"
        required: true
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relancer la génération
        env:
          KEY: ${{ secrets.TU_ADMIN_KEY }}
          S: ${{ github.event.inputs.session }}
        run: |
          case "$S" in *[!A-Za-z0-9_-]*|"") echo "::error::identifiant invalide"; exit 1;; esac
          code=$(curl -s -o out.txt -w "%{http_code}" -X POST "https://nmoigruxnhsidrhqtzid.supabase.co/functions/v1/stripe-webhook?key=${KEY}&regen=${S}")
          echo "HTTP $code"; head -c 300 out.txt; echo
          [ "$code" = "200" ] || { echo "::error::échec HTTP $code"; exit 1; }
