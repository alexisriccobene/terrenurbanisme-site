name: Import de règlements
on:
  workflow_dispatch:
    inputs:
      src: { description: "adresses (PDF ou ZIP) séparées par des espaces", required: true }
      part: { description: "partition (ex. DU_243500139)", required: true }
      mode: { description: "lister ou importer", required: true, default: "lister" }
permissions:
  contents: read
jobs:
  imp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: nmoigruxnhsidrhqtzid
      SRC: ${{ github.event.inputs.src }}
      PART: ${{ github.event.inputs.part }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q poppler-utils >/dev/null
      - run: python3 .github/scripts/regl_import.py
