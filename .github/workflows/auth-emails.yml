name: E-mails de connexion en français
# Applique les modèles d'e-mails de Supabase Auth (mot de passe, confirmation, lien de connexion) depuis .github/auth/modeles.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/auth/modeles.json']
permissions:
  contents: read
jobs:
  modeles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/auth }
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          code=$(curl -sS -o out.txt -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/nmoigruxnhsidrhqtzid/config/auth" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @.github/auth/modeles.json)
          echo "HTTP $code"; head -c 300 out.txt | grep -o '"mailer_subjects_recovery":"[^"]*"' || head -c 300 out.txt
          [ "$code" = "200" ]
