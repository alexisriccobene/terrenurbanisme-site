name: Sonde de sources publiques
# Outil interne : interroge des adresses publiques (API IGN, Géoportail de l'Urbanisme...) et enregistre la réponse brute dans tu_debug (clé sonde).
on:
  push:
    branches: [main]
    paths: ['.github/sonde/urls.txt']
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: nmoigruxnhsidrhqtzid
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/sonde }
      - run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          out = []
          for u in open('.github/sonde/urls.txt').read().split():
              if not re.match(r'^https://(apicarto\.ign\.fr|www\.geoportail-urbanisme\.gouv\.fr|data\.geopf\.fr|geo\.api\.gouv\.fr|wxs\.ign\.fr)/', u): continue
              r = {'url': u}
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'TerrenUrbanisme/1.0'}), timeout=60) as resp:
                      b = resp.read(); r['status'] = resp.status; r['type'] = resp.headers.get('Content-Type'); r['bytes'] = len(b)
                      r['corps'] = b[:20000].decode('utf-8', 'replace')
              except Exception as e: r['erreur'] = str(e)[:300]
              out.append(r)
          q = "insert into public.tu_debug (k, v) values ('sonde', $tu$" + json.dumps(out, ensure_ascii=False).replace('$tu$', '') + "$tu$::jsonb)"
          rq = urllib.request.Request(f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query", data=json.dumps({'query': q}).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json'})
          print(urllib.request.urlopen(rq, timeout=60).status)
          PY
