name: Correctif d'une fonction en ligne
# Déchiffre la source de la fonction (.github/deploy/), applique le script de correctif indiqué dans .github/patch/demande.json,
# vérifie la syntaxe, redéploie, puis met à jour la copie chiffrée dans .github/deploy/.
on:
  push:
    branches: [main]
    paths: ['.github/patch/demande.json']
permissions:
  contents: write
concurrency: deploy-fonctions
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: nmoigruxnhsidrhqtzid
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Lire la clé dans le coffre
        run: |
          set -euo pipefail
          K=$(curl -sf -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select decrypted_secret as k from vault.decrypted_secrets where name = '\''tu_deploy_key'\'' limit 1"}' | jq -r '.[0].k')
          [ ${#K} -eq 64 ] || { echo "::error::clé introuvable"; exit 1; }
          echo "::add-mask::$K"
          printf '%s' "$K" > "$RUNNER_TEMP/k"
      - name: Corriger, vérifier, déployer
        run: |
          set -euo pipefail
          name=$(jq -r '.fonction' .github/patch/demande.json); script=$(jq -r '.script' .github/patch/demande.json)
          mkdir -p "supabase/functions/$name"; src="supabase/functions/$name/index.ts"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ".github/deploy/$name.ts.enc" -out "$src" -pass "file:$RUNNER_TEMP/k"
          python3 ".github/patch/$script" "$src"
          npx -y esbuild@0.21.5 "$src" --format=esm --log-level=error > /dev/null
          echo "Syntaxe vérifiée"
          supabase functions deploy "$name" --project-ref "$REF" --no-verify-jwt --yes
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "supabase/functions/$name/index.ts" -out ".github/deploy/$name.ts.enc" -pass "file:$RUNNER_TEMP/k"
          echo "Déployé et chiffré : $name"
          rm -f "$RUNNER_TEMP/k"; sudo rm -rf supabase || true
      - name: Enregistrer
        run: |
          git config user.name "TerrenUrbanisme"
          git config user.email "contact@terrenurbanisme.com"
          git add .github/deploy
          git diff --cached --quiet && exit 0
          git commit -m "Fonctions : copie chiffrée alignée sur la version en ligne"
          git pull --rebase origin main && git push
