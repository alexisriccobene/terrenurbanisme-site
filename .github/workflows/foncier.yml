name: Foncier entreprises
# Exécute .github/foncier/<script> (indiqué dans .github/foncier/demande.json) ; sorties dans tests-rapports/foncier/
on:
  push:
    branches: [main]
    paths: ['.github/foncier/demande.json']
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REF: nmoigruxnhsidrhqtzid
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q shapely pyproj requests ijson
      - run: |
          mkdir -p /tmp/out
          S=$(python3 -c "import json;print(json.load(open('.github/foncier/demande.json'))['script'])")
          python3 -u .github/foncier/$S 2>&1 | tee /tmp/out/log.txt
      - if: always()
        uses: actions/checkout@v4
        with: { ref: tests-rapports, path: tr }
      - if: always()
        run: |
          cd tr; rm -rf foncier; mkdir -p foncier; cp -r /tmp/out/* foncier/ 2>/dev/null || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add foncier && git commit -qm "foncier [skip ci]" && git push -q origin tests-rapports || true
