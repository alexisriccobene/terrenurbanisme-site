name: Données communes (prix DVF, loi Montagne)
on:
  push:
    paths: ['.github/scripts/donnees.py', '.github/workflows/donnees.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: python .github/scripts/donnees.py
      - name: Enregistrer
        run: |
          git config user.name "TerrenUrbanisme données"
          git config user.email "contact@terrenurbanisme.com"
          git add data
          git diff --cached --quiet || (git commit -m "Données communes : prix DVF et loi Montagne" && git push)
